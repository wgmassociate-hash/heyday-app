services:
  - type: web
    name: heydaystar
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && if [ -n "$DATABASE_URL" ]; then npm run db:migrate:deploy; fi
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADSENSE_PUBLISHER_ID
        sync: false
      - key: VITE_ADSENSE_CLIENT
        sync: false
      - key: VITE_ADSENSE_SLOT_BANNER
        sync: false
      - key: VITE_ADSENSE_SLOT_RECTANGLE
        sync: false
      - key: VITE_ADSENSE_SLOT_LEADERBOARD
        sync: false
      - key: VITE_ADSENSE_SLOT_LOADING
        sync: false
      - key: VITE_ADSENSE_SLOT_RESULT_TOP
        sync: false
      - key: VITE_ADSENSE_SLOT_RESULT_MIDDLE
        sync: false
      - key: VITE_ADSENSE_SLOT_RESULT_BOTTOM
        sync: false
      - key: RATE_LIMIT_DISABLED
        sync: false
