# Render free tier spins down after ~15 min with no HTTP traffic.
# This pings /api/health so the app stays warm (workaround — Starter $7/mo is the proper fix).
#
# Optional: GitHub repo → Settings → Variables → KEEP_ALIVE_URL
# Example: https://app.heydaystar.co.kr/api/health

name: Keep Render awake

on:
  schedule:
    # UTC. Every 14 min — slightly under Render's 15 min idle cutoff.
    - cron: '*/14 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          URL="${KEEP_ALIVE_URL:-https://app.heydaystar.co.kr/api/health}"
          echo "Pinging: $URL"
          curl -fsS --max-time 25 -w "\nHTTP %{http_code} · %{time_total}s\n" "$URL"
